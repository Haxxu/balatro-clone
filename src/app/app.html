<main class="start-screen">
  <div class="start-screen__background" aria-hidden="true"></div>

  <section class="hero-panel" aria-label="Main menu">
    <div class="hero-panel__brand">
      <p class="eyebrow">Web Prototype</p>
      <h1>{{ title() }}</h1>
      <p class="subtitle">A lightweight first-pass layout for your start screen.</p>
    </div>

    <div class="menu-dock">
      <button class="profile-card" type="button" aria-label="Profile">
        <span class="profile-card__label">Profile</span>
        <span class="profile-card__name">{{ playerName() }}</span>
      </button>

      <nav class="menu-actions" aria-label="Primary actions">
        @for (item of menuItems; track item) {
          <button class="menu-actions__button" type="button">{{ item }}</button>
        }
      </nav>
    </div>
  </section>
</main>
