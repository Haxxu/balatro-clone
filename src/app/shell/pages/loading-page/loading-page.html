<div class="min-h-dvh overflow-hidden bg-[#09070d] text-[#f8f3e7]">
  <div
    class="min-h-dvh grid place-items-center bg-[radial-gradient(circle_at_top,rgba(255,255,255,0.12),transparent_28rem)] px-4"
  >
    <section
      class="w-full max-w-130 rounded-3xl border-[3px] border-[#f8f3e7] bg-[#0c0912]/90 p-8 shadow-[0_24px_80px_rgba(0,0,0,0.5),inset_0_0_0_2px_rgba(255,255,255,0.06)]"
    >
      <header class="mb-9 text-center">
        <h1
          class="text-[clamp(42px,8vw,76px)] font-black leading-[0.9] tracking-[0.04em] drop-shadow-[6px_6px_0_rgba(0,0,0,0.35)]"
        >
          BALATRO
        </h1>

        <p class="mt-3 text-sm uppercase tracking-[0.2em] text-[#f8f3e7]/70">Angular Clone</p>
      </header>

      @if (preloadState().status !== 'error') {
        <div class="grid gap-4">
          <div class="flex items-center justify-between gap-4">
            <p class="text-base text-[#f8f3e7]/85">
              {{ preloadState().currentStepLabel }}
            </p>

            <p class="text-sm tabular-nums text-[#f8f3e7]/70">{{ preloadState().progress }}%</p>
          </div>

          <div
            class="h-6 overflow-hidden rounded-full border-2 border-[#f8f3e7]/80 bg-black/35 p-1"
          >
            <div
              class="h-full rounded-full bg-linear-to-r from-[#ff4f7a] to-[#ffd166] transition-[width duration-200 ease-out"
              [style.width.%]="preloadState().progress"
            ></div>
          </div>

          <div class="mt-2 flex justify-center gap-2">
            <span class="h2 w-2 animate-bounce rounded-full bg-[#f8f3e7]/80"></span>
            <span
              class="h2 w-2 animate-bounce rounded-full bg-[#f8f3e7]/80 [animation-delay:120ms]"
            ></span>
            <span
              class="h2 w-2 animate-bounce rounded-full bg-[#f8f3e7]/80 [animation-delay:240ms]"
            ></span>
          </div>
        </div>
      } @else {
        <div class="grid gap-2">
          <h2 class="text-2xl font-extrabold text-red-400">Load failed</h2>

          <p class="leading-7 text-[#f8f3e7]/75">
            {{ preloadState().errorMessage }}
          </p>

          <button
            type="button"
            class="w-fit rounded-full bg-[#f8f3e7] px-5 py-2.5 font-extrabold text-[#17111f] transition hover:-translate-y-0.5 hover:bg-white"
            (click)="retry()"
          >
            Retry
          </button>
        </div>
      }
    </section>
  </div>
</div>
